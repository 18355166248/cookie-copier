<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Cookie Copier</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 360px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        color: #333;
        padding: 16px;
        background: #f7f8fa;
      }

      h2 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #111;
      }

      label {
        display: block;
        font-size: 12px;
        color: #666;
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 13px;
        outline: none;
        background: #fff;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: #4a90e2;
      }

      button {
        margin-top: 12px;
        width: 100%;
        height: 36px;
        background: #4a90e2;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.2s,
          opacity 0.2s;
      }

      button:hover {
        background: #357abd;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        margin-top: 10px;
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 12px;
        min-height: 30px;
        display: none;
      }

      .status.loading {
        display: block;
        background: #eef4ff;
        color: #4a90e2;
      }

      .status.success {
        display: block;
        background: #edfaf1;
        color: #27ae60;
      }

      .status.error {
        display: block;
        background: #fff0f0;
        color: #e74c3c;
      }

      .status.warn {
        display: block;
        background: #fffbe6;
        color: #b8860b;
      }
    </style>
  </head>

  <body>
    <h2>Cookie Copier</h2>
    <label for="input">本地访问地址</label>
    <input id="input" type="text" placeholder="http://localhost:3000" />
    <button id="copy-cookie">一键复制 Cookie</button>
    <div id="status" class="status"></div>

    <script src="js/popup.js"></script>
  </body>
</html>
